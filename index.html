exSection('xder','Derivadas',EXI,[
 {t:'Derivada y recta tangente',src:'Recuperatorio integrador',en:'f(x) = x e<sup>−3x</sup>',it:[
  ['a)','Derivada usando reglas de derivación.',[
   ['f′(x) = 1 · e<sup>−3x</sup> + x · e<sup>−3x</sup> · (−3)','Regla del producto y de la cadena'],
   ['f′(x) = e<sup>−3x</sup>(1 − 3x)','Factor común']]],
  ['b)','Recta tangente en x = 0.',[
   ['f(0) = 0 ; f′(0) = e⁰(1 − 0) = 1',''],
   ['y − 0 = 1(x − 0) → y = x','']]]]},
 {t:'Derivada por definición',src:'2do parcial 27/06/2023',en:'f(x) = 9 − x²',it:[
  ['a)','Derivada por definición.',[
   ['f′(x) = lím h→0 [f(x + h) − f(x)]/h',''],
   ['f(x + h) − f(x) = 9 − (x + h)² − 9 + x² = −2xh − h²',''],
   ['[−2xh − h²]/h = −2x − h',''],
   ['f′(x) = −2x','Tomamos h → 0']]],
  ['b)','Recta tangente en x = 2.',[
   ['f(2) = 5 ; f′(2) = −4',''],
   ['y − 5 = −4(x − 2) → y = −4x + 13','']]]]},
 {t:'Reglas básicas y regla de la cadena',src:'2do parcial (dos temas)',en:'Hallar las derivadas.',it:[
  ['a)',`g(x) = 5x³ − 4 cos x + ${F(2,'x')} + 7e<sup>x</sup> − ln x`,[
   ['(5x³)′ = 15x² ; (−4 cos x)′ = 4 sen x',''],
   ['(2/x)′ = (2x⁻¹)′ = −2/x² ; (7e<sup>x</sup>)′ = 7e<sup>x</sup> ; (ln x)′ = 1/x',''],
   ['g′(x) = 15x² + 4 sen x − 2/x² + 7e<sup>x</sup> − 1/x','']]],
  ['b)',`f(x) = sen(${R('','x² + 4')})`,[
   [`f′(x) = cos(${R('','x² + 4')}) · (${R('','x² + 4')})′`,'Regla de la cadena'],
   [`(${R('','x² + 4')})′ = ${F('2x',`2${R('','x² + 4')}`)} = ${F('x',R('','x² + 4'))}`,'Derivada de la raíz por la derivada de adentro'],
   [`f′(x) = ${F(`x · cos(${R('','x² + 4')})`,R('','x² + 4'))}`,'']]]]},
 {t:'Producto y cociente con funciones compuestas',src:'2do parcial Bioquímica',en:'Hallar las derivadas.',it:[
  ['a)',`y = cos(${F('√x','2π')}) · (3x − ln x⁵)`,[
   ['ln x⁵ = 5 ln x (x &gt; 0)','Simplificamos antes de derivar'],
   [`u = cos(${F('√x','2π')}) → u′ = −sen(${F('√x','2π')}) · ${F(1,'4π√x')}`,'(√x / 2π)′ = 1/(2π · 2√x)'],
   [`v = 3x − 5 ln x → v′ = 3 − ${F(5,'x')}`,''],
   [`y′ = −${F(`sen(${F('√x','2π')}) · (3x − 5 ln x)`,'4π√x')} + cos(${F('√x','2π')}) · (3 − ${F(5,'x')})`,'Regla del producto: u′v + uv′']]],
  ['b)',`y = ${F('tg(5x)','(x − 1)²')}`,[
   ['u = tg(5x) → u′ = 5 sec²(5x) ; v = (x − 1)² → v′ = 2(x − 1)',''],
   [`y′ = ${F('5 sec²(5x) · (x − 1)² − 2(x − 1) · tg(5x)','(x − 1)⁴')}`,'Regla del cociente: (u′v − uv′)/v²'],
   [`y′ = ${F('5(x − 1) sec²(5x) − 2 tg(5x)','(x − 1)³')}`,'Simplificamos un factor (x − 1)']]]]},
 {t:'Más derivadas con la regla de la cadena',src:'2do parciales Bioquímica 2024 y 2025',en:'Hallar las derivadas.',it:[
  ['a)',`f(x) = e<sup>x</sup> · ${R('','sen(5x + 7)')}`,[
   [`(${R('','sen(5x + 7)')})′ = ${F('5 cos(5x + 7)',`2${R('','sen(5x + 7)')}`)}`,'Cadena: la derivada de sen(5x + 7) es 5 cos(5x + 7)'],
   [`f′(x) = e<sup>x</sup>${R('','sen(5x + 7)')} + e<sup>x</sup> · ${F('5 cos(5x + 7)',`2${R('','sen(5x + 7)')}`)}`,'Regla del producto'],
   [`f′(x) = ${F('e<sup>x</sup>[2 sen(5x + 7) + 5 cos(5x + 7)]',`2${R('','sen(5x + 7)')}`)}`,'Común denominador']]],
  ['b)',`y = x² · tg(${F(1,'x')}) + ln(5x)`,[
   [`(x² tg(${F(1,'x')}))′ = 2x tg(${F(1,'x')}) + x² sec²(${F(1,'x')}) · (−${F(1,'x²')})`,'Producto y cadena: (1/x)′ = −1/x²'],
   [`= 2x tg(${F(1,'x')}) − sec²(${F(1,'x')})`,'x² · (1/x²) = 1'],
   [`(ln(5x))′ = ${F(5,'5x')} = ${F(1,'x')}`,''],
   [`y′ = 2x tg(${F(1,'x')}) − sec²(${F(1,'x')}) + ${F(1,'x')}`,'']]],
  ['c)',`y = ${R('',F('cos x − 1','sen x'))}`,[
   [`u = ${F('cos x − 1','sen x')} → u′ = ${F('−sen x · sen x − (cos x − 1) · cos x','sen²x')}`,'Regla del cociente'],
   [`u′ = ${F('−sen²x − cos²x + cos x','sen²x')} = ${F('cos x − 1','sen²x')}`,'sen²x + cos²x = 1'],
   [`y′ = ${F('u′',`2${R('','u')}`)} = ${F('cos x − 1',`2 sen²x · ${R('',F('cos x − 1','sen x'))}`)}`,'Derivada de una raíz']]]]},
 {t:'Verdadero o falso sobre derivadas',src:'2do parcial Farmacia (doble cursado) · Examen libre',en:'Justificar con los cálculos.',it:[
  ['a)','La derivada de f(x) = ln √(2x² − 2x) en x = −1 no existe.',[
   ['Dominio: 2x² − 2x &gt; 0 → x &lt; 0 o x &gt; 1 ; x = −1 está en el dominio',''],
   [`f(x) = ½ ln(2x² − 2x) → f′(x) = ${F('4x − 2','2(2x² − 2x)')} = ${F('2x − 1','2x² − 2x')}`,'Propiedad del logaritmo y cadena'],
   [`f′(−1) = ${F('2(−1) − 1','2 + 2')} = ${F('−3',4)}`,''],
   ['f′(−1) = −3/4 existe','FALSO: la derivada en x = −1 sí existe']]],
  ['b)','La derivada de y = (1 + 2x)(x − x²)³ es y′ = 2(x − x²)³ + 3(x − x²)²(1 − 4x²).',[
