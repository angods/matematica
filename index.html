<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Guías de Matemática UNaM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=STIX+Two+Text:ital@0;1&display=swap">
<style>
/* Layout: cuaderno cuadriculado — cabecera, fila de pestañas pegajosa, una unidad por panel con tarjetas de ejercicio numeradas como en la guía */
:root{
  /* Tema oscuro único: pizarrón de noche con tinta eléctrica */
  --bg:#080b12; --bg2:#0c111c; --paper:#111726; --paper2:#151d30; --ink:#e9edf7; --muted:#8f9bb5; --line:#232d45; --grid:rgba(124,156,255,.045);
  --accent:#7c9cff; --accent2:#a78bfa; --accent-soft:rgba(124,156,255,.14); --accent-ink:#0a0e18; --alt:#ffb454; --ok:#3ddc97; --bad:#ff6b7a;
  --hl:rgba(255,180,84,.26); --grass:#1f5a34; --mowed:#7fd49a; --water:#3d8bff; --glass:#34405c;
  --glow:0 0 0 1px rgba(124,156,255,.35),0 8px 30px -8px rgba(124,156,255,.45);
  --ease:cubic-bezier(.22,1,.36,1);
  --f-display:'Bricolage Grotesque',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-math:'STIX Two Text','Cambria Math',Cambria,Georgia,serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);min-height:100vh;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(124,156,255,.13),transparent 60%),radial-gradient(700px 420px at -10% 10%,rgba(167,139,250,.08),transparent 60%),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:auto,auto,28px 28px,28px 28px;background-attachment:fixed,fixed,scroll,scroll}
::selection{background:rgba(124,156,255,.35)}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:0 64px}
header.top{padding-block:32px 18px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:end;justify-content:space-between}
.eyebrow{font:500 12px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:800 clamp(34px,6vw,58px)/1 var(--f-display);letter-spacing:-.02em;margin:8px 0 0;text-wrap:balance}
h1 .r{color:var(--accent);font-family:var(--f-math);font-weight:400}
.progress{min-width:220px;flex:0 1 280px}
.progress .lbl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.progress .lbl b{color:var(--ink);font-variant-numeric:tabular-nums}
.pbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--ok);transition:width .5s}

.navs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.guides{display:flex;gap:4px;overflow-x:auto;padding-block:10px 4px;scrollbar-width:thin}
nav.guides button{flex:0 0 auto;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);font:600 14px var(--f-display);padding:6px 10px;cursor:pointer;white-space:nowrap}
nav.guides button .n{font:600 11px var(--f-mono);margin-right:6px;padding:2px 5px;border-radius:4px;background:var(--line);color:var(--ink)}
nav.guides button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav.guides button[aria-pressed="true"] .n{background:var(--accent);color:var(--accent-ink)}
nav.guides button:focus-visible{outline:2px solid var(--alt);outline-offset:2px}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:6px 10px;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--paper);color:var(--ink);font:500 13px var(--f-body);
  padding:7px 12px;border-radius:999px;cursor:pointer;white-space:nowrap}
nav.tabs button .n{font-family:var(--f-mono);color:var(--muted);margin-right:6px}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
nav.tabs button[aria-selected="true"] .n{color:inherit;opacity:.8}

section.panel{padding-top:22px;display:flex;flex-direction:column;gap:22px}
section.panel>h2{font:700 28px/1.1 var(--f-display);margin:6px 0 0;letter-spacing:-.01em}
.intro{color:var(--muted);max-width:68ch;margin:-12px 0 0}
.ex{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.ex-h{display:flex;gap:12px;align-items:baseline}
.ex-n{font:600 12px var(--f-mono);color:var(--accent);background:var(--accent-soft);padding:3px 8px;border-radius:4px;flex:0 0 auto}
.ex-h h3{font:650 18px/1.3 var(--f-display);margin:0;text-wrap:balance}
.en{margin:0;max-width:72ch}
.sub{border-top:1px dashed var(--line);padding-top:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.sub-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sub-h .l{font:600 13px var(--f-mono);color:var(--muted)}
.m{font-family:var(--f-math);font-size:1.18em;line-height:1.9}
.m i{font-style:italic}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.15;margin:0 .1em}
.fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .2em}
.fr>span:last-child{padding:0 .2em}
.rad{white-space:nowrap}
.rad .ri{font-size:.62em;margin-right:-.3em;vertical-align:.9em}
.rad .rb{border-top:1.4px solid currentColor;padding:0 .15em;margin-left:.02em}
.rad:has(.fr){display:inline-flex;align-items:stretch;vertical-align:middle}
.rad:has(.fr)>.rs{display:flex;align-items:flex-end;font-size:1.45em;line-height:1;transform:scaleY(1.25);transform-origin:bottom}
.rad:has(.fr)>.rb{display:inline-flex;align-items:center;padding-top:.15em}
.rad:has(.fr)>.rb>.fr{margin:0}
sup{line-height:0}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;align-items:start}
.grid2>*{min-width:0}
.fig{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;min-width:0}
.fig svg{display:block;width:100%;height:auto;overflow:visible}
.caption{font-size:13px;color:var(--muted);margin:6px 2px 0}

.btn{font:600 13px var(--f-body);border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:6px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.link{border-color:transparent;background:transparent;color:var(--muted);padding-inline:6px;text-decoration:underline;text-underline-offset:3px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,nav.tabs button:focus-visible,.opt:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible{outline:2px solid var(--alt);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--paper);color:var(--ink);font:500 13px var(--f-body);padding:7px 11px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}

input[type=text],input[type=number],select{font:15px var(--f-mono);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:7px 10px;min-width:0}
input[type=range]{width:100%;accent-color:var(--accent)}
.slider{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:14px}
.slider output{font:500 14px var(--f-mono);min-width:5.5ch;text-align:right;font-variant-numeric:tabular-nums}

.chk{display:flex;flex-direction:column;gap:6px}
.chk label{font-size:13px;color:var(--muted)}
.chk-row{display:flex;gap:8px;flex-wrap:wrap}
.chk-row input{flex:1 1 180px}
.fb{margin:0;font-size:14px;min-height:1.4em}
.fb.ok{color:var(--ok);font-weight:600}
.fb.bad{color:var(--bad)}
.hint{font-size:12px;color:var(--muted)}

.mc{display:flex;flex-direction:column;gap:8px}
.mc .q{font-size:13px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{font-family:var(--f-math);font-size:17px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer;transition:border-color .2s,background .2s}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.opt.wrong{border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

.stp{display:flex;flex-direction:column;gap:10px}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:s}
li.step{counter-increment:s;display:grid;grid-template-columns:28px 1fr;column-gap:10px;align-items:start;padding:8px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line);animation:stepin .45s ease both}
li.step::before{content:counter(s);grid-row:span 2;font:600 12px var(--f-mono);color:var(--accent);background:var(--accent-soft);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;margin-top:6px}
li.step .sm{font-family:var(--f-math);font-size:18px;line-height:2;overflow-x:auto;min-width:0}
li.step .sw{font-size:13px;color:var(--muted)}
li.step.final{border-color:var(--ok)}
li.step.final .sm{background:linear-gradient(transparent 55%,var(--hl) 55%);width:fit-content;max-width:100%}
@keyframes stepin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

details.ans{border-left:3px solid var(--accent);padding:4px 0 4px 12px}
details.ans summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
details.ans p{margin:8px 0 0;max-width:70ch}

table.tb{border-collapse:collapse;font:15px var(--f-mono);font-variant-numeric:tabular-nums;width:100%}
table.tb th,table.tb td{border:1px solid var(--line);padding:6px 10px;text-align:right}
table.tb th{background:var(--accent-soft);font-family:var(--f-math);font-size:17px;text-align:center}
table.tb tbody tr{cursor:pointer}
table.tb tbody tr:hover td{background:var(--accent-soft)}
table.tb tr.on td{background:var(--hl)}
td.val.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.12)}}

.out{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.out .big{font-family:var(--f-math);font-size:24px}
.out .dec{font:15px var(--f-mono);word-break:break-all;color:var(--muted)}
.tag{display:inline-block;font:600 12px var(--f-mono);letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.tag.q{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tag.i{background:color-mix(in srgb,var(--alt) 18%,transparent);color:var(--alt)}

.chain{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.chain .link{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;opacity:.35;transition:opacity .4s,border-color .4s}
.chain .link.on{opacity:1;border-color:var(--accent)}
.chain .link .k{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.chain .link .v{font:600 20px var(--f-mono);margin:4px 0;font-variant-numeric:tabular-nums}
.chain .link .h{font-size:13px;color:var(--muted)}
.dims{display:flex;flex-wrap:wrap;gap:12px}
.dims label{display:flex;flex-direction:column;font-size:13px;color:var(--muted);gap:4px}
.dims input{width:100px}

.readout{font:14px var(--f-mono);font-variant-numeric:tabular-nums;display:flex;flex-direction:column;gap:3px}
.readout .yes{color:var(--ok);font-weight:600}.readout .no{color:var(--bad);font-weight:600}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;font:600 15px var(--f-mono);border:1px solid var(--line);background:var(--paper);color:var(--muted);transition:all .35s}
.chip.in{color:var(--ink);border-color:var(--ink)}
.chip.res{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);transform:translateY(-3px)}
.setrow{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center}
.setrow .nm{font:italic 20px var(--f-math)}

.algae{display:grid;grid-template-columns:repeat(16,1fr);gap:4px;max-width:420px}
.algae span{aspect-ratio:1;border-radius:50%;background:var(--line);transform:scale(.55);transition:transform .3s,background .3s}
.algae span.on{background:var(--grass);transform:scale(1)}

/* svg */
.grid-l{stroke:var(--line);stroke-width:1}
.axis{stroke:var(--muted);stroke-width:1.3}
.tick{fill:var(--muted);font:11px var(--f-mono)}
.lbl-s{fill:var(--ink);font:13px var(--f-math);font-style:italic}
.lbl-m{fill:var(--muted);font:12px var(--f-body)}
.curve{fill:none;stroke:var(--accent);stroke-width:2.4}
.curve2{fill:none;stroke:var(--alt);stroke-width:2.4}
.guide{stroke:var(--muted);stroke-dasharray:3 3;stroke-width:1}
.pt{fill:var(--alt);stroke:var(--paper);stroke-width:2}
.pt-a{fill:var(--accent);stroke:var(--paper);stroke-width:2}
.pt-ok{fill:var(--ok);stroke:var(--paper);stroke-width:2}
.s-r1{stroke:var(--accent)}.s-r2{stroke:var(--alt)}.s-res{stroke:var(--ok)}
.f-r1{fill:var(--accent)}.f-r2{fill:var(--alt)}.f-res{fill:var(--ok)}
.hollow{fill:var(--bg)!important;stroke-width:2.2}
.seg-l{stroke-width:5;stroke-linecap:butt;fill:none}
.tile{stroke:var(--paper);stroke-width:2}
.tile-sq{fill:var(--accent)}.tile-x{fill:var(--alt)}
.tile-c{fill:transparent;stroke:var(--ink);stroke-dasharray:5 4;stroke-width:1.6}
.tile-t{fill:var(--accent-ink);font:15px var(--f-math);font-style:italic}
.tile-tc{fill:var(--ink);font:14px var(--f-math)}
.water{fill:var(--water)}
.glass{fill:none;stroke:var(--muted);stroke-width:2}
.stream{stroke:var(--water);stroke-width:4;stroke-dasharray:6 5;animation:flow .5s linear infinite}
@keyframes flow{to{stroke-dashoffset:-11}}
.grass{fill:var(--grass)}.mowed{fill:none;stroke:var(--mowed)}
.mower{fill:var(--alt);stroke:var(--paper);stroke-width:2}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:520px){.ex{padding:14px}li.step .sm{font-size:16px}}

/* ---------- tema oscuro: superficies ---------- */
header.top{position:relative}
.htext{position:relative;z-index:1}
.hdeco{position:absolute;right:0;top:0;width:min(520px,62%);height:auto;opacity:.6;pointer-events:none;z-index:0}
#hdot{filter:drop-shadow(0 0 8px #ffb454)}
h1{background:linear-gradient(100deg,#fff 20%,#c9d4ff 60%,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent;animation:titleIn .9s var(--ease) both}
@keyframes titleIn{from{opacity:0;transform:translateY(10px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
.progress{position:relative;z-index:1;padding:10px 14px;border-radius:12px;background:rgba(10,14,24,.72);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pbar{background:rgba(255,255,255,.06);height:8px}
.pbar i{background:linear-gradient(90deg,var(--ok),#7cf0c4);box-shadow:0 0 14px rgba(61,220,151,.55);transition:width .9s var(--ease)}
.navs{background:rgba(8,11,18,.78);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom-color:var(--line)}
nav.guides{position:relative}
nav.guides button{border-bottom:0!important;transition:color .3s var(--ease)}
nav.guides button .n{background:var(--line);transition:background .35s var(--ease),color .35s}
nav.guides .ind{position:absolute;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--accent2));box-shadow:0 0 12px rgba(124,156,255,.8);transition:left .5s var(--ease),width .5s var(--ease)}
nav.tabs button{background:var(--paper);transition:background .3s var(--ease),border-color .3s,color .3s,transform .25s var(--ease),box-shadow .3s}
nav.tabs button:hover{border-color:var(--accent);transform:translateY(-1px)}
nav.tabs button[aria-selected="true"]{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;box-shadow:var(--glow)}
.ex{background:linear-gradient(180deg,var(--paper2),var(--paper));border-color:var(--line);border-radius:14px;box-shadow:0 1px 0 rgba(255,255,255,.04) inset,0 20px 40px -24px rgba(0,0,0,.8);transition:border-color .4s var(--ease),box-shadow .4s var(--ease)}
.ex:hover{border-color:#2f3b5c}
.ex-n{background:var(--accent-soft);color:var(--accent);box-shadow:0 0 0 1px rgba(124,156,255,.25) inset}
.fig{background:radial-gradient(120% 90% at 50% 0%,#0f1628,#0a0f1b);border-color:var(--line);border-radius:12px}
.out,.chain .link,li.step{background:var(--bg2)}
.btn{border-radius:8px;transition:transform .25s var(--ease),box-shadow .3s var(--ease),background .3s,filter .3s}
.btn:not(.ghost):not(.link){background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;box-shadow:0 6px 18px -6px rgba(124,156,255,.7)}
.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.08)}
.btn:active:not(:disabled){transform:translateY(0) scale(.97)}
.btn.ghost:hover:not(:disabled){background:var(--accent-soft);box-shadow:var(--glow)}
.seg{border-color:var(--line);background:var(--paper)}
.seg button{background:transparent;transition:background .3s var(--ease),color .3s}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:#c7d3ff}
.opt{background:var(--paper);transition:transform .25s var(--ease),border-color .3s,background .3s,box-shadow .3s}
.opt:hover{transform:translateY(-2px);box-shadow:0 8px 20px -10px rgba(124,156,255,.6)}
.opt.right{box-shadow:0 0 0 1px var(--ok),0 0 22px -4px rgba(61,220,151,.7);animation:okpop .5s var(--ease)}
.opt.wrong{animation:nudge .45s var(--ease)}
@keyframes okpop{40%{transform:scale(1.06)}}
@keyframes nudge{20%{transform:translateX(-5px)}45%{transform:translateX(4px)}70%{transform:translateX(-2px)}}
input[type=text],input[type=number],select{background:var(--bg2);border-color:var(--line);transition:border-color .3s,box-shadow .3s}
input[type=text]:focus,input[type=number]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(124,156,255,.2)}
.fb.ok{animation:fbIn .5s var(--ease)}.fb.bad{animation:fbIn .4s var(--ease)}
@keyframes fbIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
li.step{animation:stepin .6s var(--ease) both}
@keyframes stepin{from{opacity:0;transform:translateY(10px) scale(.98);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
li.step.final{box-shadow:0 0 0 1px rgba(61,220,151,.4),0 0 24px -10px rgba(61,220,151,.8)}
details.ans summary{transition:color .3s}
details.ans[open] p{animation:fbIn .45s var(--ease)}
table.tb th{background:rgba(124,156,255,.1)}
table.tb td{transition:background .4s var(--ease)}
.chip{transition:all .45s var(--ease)}
.chip.res{box-shadow:0 0 18px -4px rgba(124,156,255,.8)}
/* entrada de paneles */
section.panel.enter>*{animation:rise .7s var(--ease) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
/* trazos que se dibujan y puntos que aparecen */
path.drawin{stroke-dasharray:1;animation:draw 1.3s var(--ease) both}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}

/* ---------- resolver eligiendo pasos ---------- */
nav.tabs button.pptab{border-color:rgba(255,180,84,.5);color:#ffd49a}

nav.tabs button.pptab[aria-selected="true"]{background:linear-gradient(135deg,#ffb454,#ff8a5c);color:#1a1006;box-shadow:0 0 0 1px rgba(255,180,84,.4),0 8px 26px -8px rgba(255,160,84,.7)}
nav.tabs button.pptab[aria-selected="true"] .n{color:#1a1006;opacity:1}
.pp{display:flex;flex-direction:column;gap:14px}
.pp-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pp-dots{display:flex;gap:6px}
.pp-dots span{width:28px;height:6px;border-radius:3px;background:var(--line);transition:background .5s var(--ease),box-shadow .5s,width .5s var(--ease)}
.pp-dots span.now{background:var(--alt);width:40px;box-shadow:0 0 12px rgba(255,180,84,.7)}

li.pp-step{position:relative;counter-increment:pp;background:var(--bg2);border:1px solid rgba(61,220,151,.3);border-radius:10px;padding:10px 12px;animation:ppIn .6s var(--ease) both}
li.pp-step::before{content:counter(pp);position:absolute;left:-31px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:#04150d;font:600 11px/22px var(--f-mono);text-align:center;box-shadow:0 0 12px rgba(61,220,151,.6)}

.pp-cur{background:linear-gradient(180deg,rgba(255,180,84,.07),transparent);border:1px solid rgba(255,180,84,.3);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px;transition:opacity .22s var(--ease),transform .22s var(--ease)}
.pp-cur.swap{opacity:0;transform:translateY(6px)}
.pp-q{font-weight:600}
.pp-n{display:block;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--alt);margin-bottom:4px}
.pp-opts{display:flex;flex-direction:column;gap:8px}
.pp-opt{text-align:left;font:16px/1.4 var(--f-math);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;animation:rise .5s var(--ease) both;transition:transform .25s var(--ease),border-color .3s,background .3s,box-shadow .3s}
.pp-opt:hover:not(:disabled){transform:translateX(4px);border-color:var(--alt);box-shadow:0 8px 20px -12px rgba(255,180,84,.7)}

.pp-end{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

.fr{line-height:1.25;margin:0 .15em;vertical-align:middle}

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const NS='http://www.w3.org/2000/svg';
function S(tag,a={},p){const e=document.createElementNS(NS,tag);for(const k in a)e.setAttribute(k,a[k]);if(tag==='path'&&/\bcurve/.test(a.class||'')&&!/dashed/.test(a.class||'')){e.setAttribute('pathLength','1');e.classList.add('drawin')}if(p)p.appendChild(e);return e}
function H(tag,a={},html){const e=document.createElement(tag);for(const k in a){if(k==='class')e.className=a[k];else e.setAttribute(k,a[k])}if(html!==undefined)e.innerHTML=html;return e}
const REDUCE=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tween(dur,fn,done){if(REDUCE){fn(1,1);done&&done();return}const t0=performance.now();(function f(n){const k=Math.min(1,Math.max(0,(n-t0)/dur));const e=k*k*k*(k*(k*6-15)+10);fn(e,k);if(k<1)requestAnimationFrame(f);else done&&done()})(t0)}
const fmt=(v,d=3)=>{if(!isFinite(v))return v>0?'+∞':'−∞';const r=+v.toFixed(d);return (Object.is(r,-0)?0:r).toLocaleString('es-AR',{maximumFractionDigits:d}).replace('-','−')};
const sci=v=>{const e=Math.floor(Math.log10(Math.abs(v)));const m=v/Math.pow(10,e);return `${fmt(m,3)} × 10<sup>${e}</sup>`};
// math shorthands
const F=(a,b)=>`<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const R=(i,b)=>`<span class="rad">${i?`<sup class="ri">${i}</sup>`:''}<span class="rs">√</span><span class="rb">${b}</span></span>`;
const x='<i>x</i>',y='<i>y</i>',z='<i>z</i>',w='<i>w</i>',p='<i>p</i>',t='<i>t</i>',c='<i>c</i>',b='<i>b</i>';
const sp=s=>`<sup>${s}</sup>`;

/* ---------- progreso ---------- */
const ids=new Set(),solved=new Set(),idG={};let CURG='g1',VIEWG='g1';
function reg(id){ids.add(id);idG[id]=CURG}
try{JSON.parse(localStorage.getItem('nr-solved')||'[]').forEach(i=>solved.add(i))}catch(e){}
function burst(el){if(REDUCE||!el||!el.getBoundingClientRect)return;const r=el.getBoundingClientRect(),b=document.createElement('div');b.className='burst';b.style.left=(r.left+r.width/2)+'px';b.style.top=(r.top+r.height/2)+'px';const C=['#3ddc97','#7c9cff','#ffb454','#a78bfa'];for(let i=0;i<16;i++){const q=document.createElement('i'),a=Math.PI*2*i/16+Math.random()*.4,d=40+Math.random()*50;q.style.background=C[i%4];q.style.setProperty('--dx',Math.cos(a)*d+'px');q.style.setProperty('--dy',Math.sin(a)*d+'px');q.style.setProperty('--r',(Math.random()*540-270)+'deg');b.appendChild(q)}document.body.appendChild(b);setTimeout(()=>b.remove(),1000)}
function markSolved(id){if(!solved.has(id))burst(document.activeElement);solved.add(id);try{localStorage.setItem('nr-solved',JSON.stringify([...solved]))}catch(e){}updateProg()}
function updateProg(){const mine=[...ids].filter(i=>idG[i]===VIEWG),n=mine.filter(i=>solved.has(i)).length;$('#prog').textContent=`${n} de ${mine.length}`;$('#pbar').style.width=(mine.length?n/mine.length*100:0)+'%'}

/* ---------- componentes ---------- */
function evalExpr(s){
  s=s.toLowerCase().replace(/\s+/g,'').replace(/[−–]/g,'-').replace(/,/g,'.').replace(/π/g,'pi').replace(/√/g,'sqrt').replace(/ra[ií]z/g,'sqrt').replace(/·|×/g,'*').replace(/\^/g,'**').replace(/^[a-z]=/,'');
  s=s.replace(/sqrt(\d+(?:\.\d+)?)/g,'sqrt($1)').replace(/(\d|\))(sqrt|pi|\()/g,'$1*$2');
  if(!s||!/^[0-9+\-*/().]*$/.test(s.replace(/sqrt|pi/g,'')))return NaN;
  try{const v=Function('sqrt','pi','"use strict";return ('+s+')')(Math.sqrt,Math.PI);return typeof v==='number'?v:NaN}catch(e){return NaN}
}
function checker(parent,{id,ans,hint}){
  reg(id);
  const box=H('div',{class:'chk'});
  box.innerHTML=`<label for="in-${id}">Tu respuesta${Array.isArray(ans)&&ans.length>1?' (separá los valores con ;)':''}</label>
  <div class="chk-row"><input id="in-${id}" type="text" autocomplete="off" spellcheck="false" placeholder="${hint||'Ej: 3 ; -1/2 ; 2√3'}"><button class="btn" type="button">Comprobar</button></div>
  <p class="fb" aria-live="polite"></p>`;
  const inp=$('input',box),fb=$('.fb',box);
  function go(){
    const raw=inp.value.trim();fb.className='fb';
    if(!raw){fb.textContent='Escribí un valor para comprobar.';return}
    if(ans==='none'){if(/sin sol|ningun|no tiene|no hay|∅|vac/i.test(raw)){ok()}else{fb.classList.add('bad');fb.textContent='Probá reemplazar ese valor en la ecuación: ¿se cumple la igualdad?'}return}
    if(ans==='all'){if(/^(ℝ|r|reales|todos|todo)/i.test(raw)){ok()}else{fb.classList.add('bad');fb.textContent='Revisá: ¿hay algún valor de x que no cumpla?'}return}
    const vals=raw.split(/;|\s+y\s+|\s+o\s+/i).map(v=>v.trim()).filter(Boolean).map(evalExpr);
    if(vals.some(isNaN)){fb.classList.add('bad');fb.textContent='No pude leer algún valor. Usá números, fracciones (1/3), coma decimal o √ (ej: 3+3√2).';return}
    const u=[];vals.forEach(v=>{if(!u.some(q=>Math.abs(q-v)<1e-9))u.push(v)});
    const near=(a,b)=>Math.abs(a-b)<=1e-3*Math.max(1,Math.abs(b));
    const hit=ans.filter(a=>u.some(v=>near(v,a))).length, extra=u.filter(v=>!ans.some(a=>near(v,a))).length;
    if(hit===ans.length&&!extra)ok();
    else if(hit&&!extra){fb.classList.add('bad');fb.textContent=`Vas bien: encontraste ${hit} de ${ans.length} soluciones. Falta alguna.`}
    else if(hit){fb.classList.add('bad');fb.textContent=`Tenés ${hit} correcta(s), pero ${extra} valor(es) no cumplen la ecuación.`}
    else{fb.classList.add('bad');fb.textContent='Ese valor no verifica. Reemplazalo en la ecuación original o mirá la resolución.'}
  }
  function ok(){fb.className='fb ok';fb.textContent='¡Correcto! Verifica la ecuación.';markSolved(id)}
  $('button',box).onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  if(solved.has(id)){fb.className='fb ok';fb.textContent='Ya lo resolviste antes.'}
  parent.appendChild(box);return box;
}
function mc(parent,{id,q,opts,ok,why}){
  reg(id);
  const box=H('div',{class:'mc'});
  box.innerHTML=`<div class="q">${q||'¿Cuál es el resultado?'}</div><div class="opts"></div><p class="fb" aria-live="polite"></p>`;
  const o=$('.opts',box),fb=$('.fb',box);
  // mezclar opciones de forma estable
  const order=opts.map((_,i)=>i).sort((a,b)=>((a*7+id.length*3)%5)-((b*7+id.length*3)%5));
  order.forEach(i=>{const bt=H('button',{class:'opt',type:'button'},opts[i]);bt.onclick=()=>{
    if(i===ok){bt.classList.add('right');fb.className='fb ok';fb.innerHTML='¡Correcto!'+(why?' '+why:'');markSolved(id)}
    else{bt.classList.remove('wrong');void bt.offsetWidth;bt.classList.add('wrong');fb.className='fb bad';fb.textContent='No es esa. Revisá los pasos o abrí la resolución.'}
  };o.appendChild(bt)});
  if(solved.has(id)){fb.className='fb ok';fb.textContent='Ya lo resolviste antes.'}
  parent.appendChild(box);return box;
}
function stepper(parent,steps,label){
  const wrap=H('div',{class:'stp'}),list=H('ol',{class:'steps'}),bar=H('div',{class:'row'});
  const nb=H('button',{class:'btn ghost',type:'button'},label||'Ver resolución paso a paso');
  const all=H('button',{class:'btn link',type:'button'},'Mostrar todo');
  const rs=H('button',{class:'btn link',type:'button'},'Reiniciar');all.hidden=true;rs.hidden=true;
  let i=0;
  function show(){if(i>=steps.length)return;const s=steps[i++];const li=H('li',{class:'step'+(i===steps.length?' final':'')},`<div class="sm">${s[0]}</div>${s[1]?`<div class="sw">${s[1]}</div>`:''}`);list.appendChild(li);
    nb.textContent=i<steps.length?`Siguiente paso (${i+1}/${steps.length})`:'Resolución completa';nb.disabled=i>=steps.length;all.hidden=i>=steps.length;rs.hidden=false}
  nb.onclick=show;all.onclick=()=>{while(i<steps.length)show()};
  rs.onclick=()=>{i=0;list.innerHTML='';nb.disabled=false;nb.textContent=label||'Ver resolución paso a paso';all.hidden=true;rs.hidden=true};
  bar.append(nb,all,rs);wrap.append(list,bar);parent.appendChild(wrap);return wrap;
}
function ans(parent,summary,html){const d=H('details',{class:'ans'},`<summary>${summary}</summary><p>${html}</p>`);parent.appendChild(d);return d}

/* recta numérica con intervalos animados */
function nline(svg,{min,max,step=1,rows,labels},anim=true){
  svg.innerHTML='';const W=600,pad=40,rowH=36,top=10,Hh=top+rows.length*rowH+34;
  svg.setAttribute('viewBox',`0 0 ${W} ${Hh}`);
  const X=v=>v===-Infinity?10:v===Infinity?W-10:pad+(v-min)/(max-min)*(W-2*pad);
  const ay=top+rows.length*rowH+6;
  S('line',{x1:6,x2:W-6,y1:ay,y2:ay,class:'axis'},svg);
  S('path',{d:`M${W-6} ${ay}l-8 -4v8z`,fill:'var(--muted)'},svg);
  for(let v=min;v<=max+1e-9;v+=step){const vv=+v.toFixed(6);S('line',{x1:X(vv),x2:X(vv),y1:ay-4,y2:ay+4,class:'axis'},svg);const tx=S('text',{x:X(vv),y:ay+20,class:'tick','text-anchor':'middle'},svg);tx.textContent=(labels&&labels(vv))||fmt(vv)}
  rows.forEach((r,ri)=>{
    const yy=top+ri*rowH+22,cls=r.cls||'r1';
    if(r.label){const lt=S('text',{x:6,y:yy-9,class:'lbl-m'},svg);lt.innerHTML=r.label}
    const g=S('g',{},svg);
    (r.segs||[]).forEach(([a,b2,ca,cb])=>{
      const x1=X(a),x2=X(b2),len=Math.max(1,x2-x1);
      [[a,x1],[b2,x2]].forEach(([v,xx])=>{if(isFinite(v))S('line',{x1:xx,x2:xx,y1:yy,y2:ay,class:'guide'},g)});
      const ln=S('line',{x1,x2,y1:yy,y2:yy,class:'seg-l s-'+cls},g);
      if(!isFinite(a))S('path',{d:`M${x1-2} ${yy}l9 -6v12z`,class:'f-'+cls},g);
      if(!isFinite(b2))S('path',{d:`M${x2+2} ${yy}l-9 -6v12z`,class:'f-'+cls},g);
      const dots=[];
      if(isFinite(a))dots.push(S('circle',{cx:x1,cy:yy,r:6,class:'f-'+cls+' s-'+cls+(ca?'':' hollow'),'stroke-width':2.2},g));
      if(isFinite(b2))dots.push(S('circle',{cx:x2,cy:yy,r:6,class:'f-'+cls+' s-'+cls+(cb?'':' hollow'),'stroke-width':2.2},g));
      if(anim&&!REDUCE){ln.setAttribute('stroke-dasharray',len);ln.setAttribute('stroke-dashoffset',len);dots.forEach(d=>d.style.opacity=0);g.style.opacity=0;
        setTimeout(()=>{g.style.opacity=1;tween(700,e=>{ln.setAttribute('stroke-dashoffset',len*(1-e));dots.forEach(d=>d.style.opacity=e)})},ri*650)}
    });
    (r.pts||[]).forEach(([v,cl])=>{S('circle',{cx:X(v),cy:yy,r:6,class:'f-'+cls+' s-'+cls+(cl?'':' hollow'),'stroke-width':2.2},g)});
  });
  return X;
}

/* explorador de inecuaciones */
function explorer(parent,{min,max,step,tick,test,sol,solTxt,dec=2}){
  const box=H('div',{class:'grid2'});
  const fig=H('div',{class:'fig'}),svg=S('svg',{role:'img','aria-label':'Recta numérica'});fig.appendChild(svg);
  const side=H('div',{class:'stp'});
  side.innerHTML=`<div class="slider"><label>${x}</label><input type="range" min="${min}" max="${max}" step="${step}" value="${((min+max)/2).toFixed(4)}"><output></output></div>
   <div class="readout"></div>
   <div class="row"><button class="btn" type="button">Barrer la recta</button></div>
   <div class="hint">Mové ${x}: el punto se pinta <b style="color:var(--ok)">verde</b> si cumple la inecuación y <b style="color:var(--bad)">rojo</b> si no. “Barrer” recorre toda la recta y marca el conjunto solución.</div>
   <div class="readout sol" hidden></div>`;
  box.append(fig,side);parent.appendChild(box);

(function(){
  const sec=P.racionales;head(sec,'Racionales e irracionales','Combiná un racional con un irracional y mirá el desarrollo decimal: si no termina ni se repite, es irracional.');
  const cd=card(sec,2,'¿Racional o irracional?',`a) ¿Es ${F(1,2)} + ${R('','2')} racional? &nbsp; b) ¿Y ${F(1,2)} · ${R('','2')}?`);
  const Qs=[['1/2',F(1,2),.5],['3','3',3],['−2/5','−'+F(2,5),-.4],['0','0',0]];
  const Is=[['√2',R('','2'),Math.SQRT2],['√3',R('','3'),Math.sqrt(3)],['π','π',Math.PI],['√5',R('','5'),Math.sqrt(5)]];
  const g=H('div',{class:'grid2'});cd.appendChild(g);
  const ctl=H('div',{class:'stp'});ctl.innerHTML=`
   <div class="row"><span class="hint" style="min-width:90px">Racional</span><div class="seg" id="rq"></div></div>
   <div class="row"><span class="hint" style="min-width:90px">Operación</span><div class="seg" id="rop"><button type="button" aria-pressed="true" data-o="+">suma +</button><button type="button" aria-pressed="false" data-o="×">producto ·</button></div></div>
   <div class="row"><span class="hint" style="min-width:90px">Irracional</span><div class="seg" id="ri"></div></div>
   <div class="row"><span class="hint">Casos con dos irracionales:</span></div>
   <div class="row" id="rsp"></div>`;
  const out=H('div',{class:'out'});g.append(ctl,out);
  let qi=0,ii=0,op='+';
  Qs.forEach((q,k)=>{const bt=H('button',{type:'button','aria-pressed':k===0},q[0]);bt.onclick=()=>{qi=k;press('#rq',bt);calc()};$('#rq',ctl).appendChild(bt)});
  Is.forEach((q,k)=>{const bt=H('button',{type:'button','aria-pressed':k===0},q[0]);bt.onclick=()=>{ii=k;press('#ri',bt);calc()};$('#ri',ctl).appendChild(bt)});
  ctl.querySelectorAll('[data-o]').forEach(bt=>bt.onclick=()=>{op=bt.dataset.o;press('#rop',bt);calc()});
  function press(sel,bt){ctl.querySelectorAll(sel+' button').forEach(q=>q.setAttribute('aria-pressed',q===bt))}
  const SP=[[`${R('','2')} + (−${R('','2')})`,0,'Los irracionales se cancelan: la suma da 0, que es racional.'],[`${R('','2')} · ${R('','2')}`,2,'√2 · √2 = √4 = 2, racional.'],[`${R('','2')} · ${R('','8')}`,4,'√2 · √8 = √16 = 4, racional.'],[`${R('','2')} + ${R('','3')}`,Math.SQRT2+Math.sqrt(3),'Esta suma sí es irracional.',true]];
  SP.forEach(s=>{const bt=H('button',{class:'opt',type:'button'},s[0]);bt.onclick=()=>render(s[0],s[1],!s[3],s[2]);$('#rsp',ctl).appendChild(bt)});

  const s2=sub(cd,'b)',`${F(1,2)} · ${R('','2')}`);mc(s2,{id:'2b',q:'Clasificá el número',opts:['Irracional','Racional'],ok:0});

/* ================= 17 · 19 · EXP Y LOG ================= */
(function(){
  const sec=P.expolog;head(sec,'Exponenciales y logaritmos','Cuando la incógnita está en el exponente, buscamos igualar bases o aplicar logaritmo.');
  const c17=card(sec,17,'Algas que se duplican cada mes',`1000 · 2${sp(t)} = 8000 (t en meses). Cada punto representa 100 algas.`);
  const g17=H('div',{class:'grid2'});c17.appendChild(g17);
  const al=H('div',{class:'algae','aria-hidden':'true'});for(let i=0;i<160;i++)al.appendChild(H('span'));
  const f17=H('div',{class:'fig'});f17.appendChild(al);
  const s17=H('div',{class:'stp'});s17.innerHTML=`<div class="slider"><label for="al-t">${t}</label><input id="al-t" type="range" min="0" max="4" step="0.01" value="0"><output></output></div><div class="readout" id="al-r"></div><div class="row"><button class="btn" type="button" id="al-go">Hacer crecer hasta 8000</button></div>`;
  g17.append(f17,s17);
  function up17(T){const N=1000*Math.pow(2,T),k=Math.min(160,Math.round(N/100));[...al.children].forEach((d,i)=>d.classList.toggle('on',i<k));$('#al-t').value=T;$('output',s17).textContent=fmt(T,2);
    $('#al-r').innerHTML=`<span>1000 · 2^${fmt(T,2)} = ${fmt(N,0)} algas</span>${Math.abs(N-8000)<60?'<span class="yes">¡8000 algas a los 3 meses!</span>':''}`}
  $('#al-t').oninput=e=>up17(+e.target.value);up17(0);
  $('#al-go').onclick=()=>{const a=+$('#al-t').value;tween(2400,e=>up17(a+(3-a)*e))};
  const a17=sub(c17,'Respuesta',`1000 · 2${sp(t)} = 8000`);checker(a17,{id:'17',ans:[3],hint:'meses'});
  stepper(a17,[[`2${sp(t)} = 8`,'Dividimos por 1000'],[`2${sp(t)} = 2${sp(3)}`,'Escribimos 8 como potencia de 2'],[`${t} = 3 meses`,'Bases iguales → exponentes iguales']]);

  const c19=card(sec,19,'Ecuaciones exponenciales y logarítmicas');
  const E19=[
   ['a)',`5${sp(`${x}²+1`)} = 25`,[1,-1],[[`5${sp(`${x}²+1`)} = 5${sp(2)}`,'25 = 5²'],[`${x}${sp(2)} + 1 = 2`,'Igualamos exponentes'],[`${x}${sp(2)} = 1 → ${x} = ±1`,'']]],
   ['b)',`3 · 2${sp(`${x}+2`)} − 5 · 2${sp(x)} = 56`,[3],[[`3 · 2${sp(x)} · 2${sp(2)} − 5 · 2${sp(x)} = 56`,'2^(x+2) = 2^x · 2²'],[`(12 − 5) · 2${sp(x)} = 56`,'Factor común 2^x'],[`2${sp(x)} = 8 = 2${sp(3)} → ${x} = 3`,'']]],
   ['c)',`log${'<sub>4</sub>'}(${x} + 4) = 2`,[12],[[`${x} + 4 = 4${sp(2)}`,'Definición: log_b(A) = c ⇔ b^c = A'],[`${x} + 4 = 16 → ${x} = 12`,'Verifica: 12 + 4 &gt; 0']]],
   ['d)',`2${sp(`2${x}`)} − 2${sp(`${x}+2`)} = 32`,[3],[[`(2${sp(x)})${sp(2)} − 4 · 2${sp(x)} − 32 = 0`,'2^(2x) = (2^x)² y 2^(x+2) = 4·2^x'],[`u${sp(2)} − 4u − 32 = 0, &nbsp; u = 2${sp(x)}`,'Sustitución'],[`(u − 8)(u + 4) = 0 → u = 8 &nbsp;(u = −4 no sirve: 2^x &gt; 0)`,''],[`2${sp(x)} = 8 → ${x} = 3`,'']]],
   ['e)',`log ${x} + log(${x} + 9) = 1`,[1],[[`log[${x}(${x} + 9)] = 1`,'Logaritmo de un producto (x &gt; 0)'],[`${x}${sp(2)} + 9${x} = 10`,'log A = 1 ⇔ A = 10¹'],[`(${x} + 10)(${x} − 1) = 0`,''],[`${x} = 1 &nbsp;(${x} = −10 se descarta: log de negativo)`,'']]],
   ['f)',`log(7${x} + 1) = 2 log(${x} + 3) − log 2`,[1,7],[[`log(7${x} + 1) = log ${F(`(${x} + 3)${sp(2)}`,2)}`,'Propiedades: n·log A = log Aⁿ; log A − log B = log(A/B)'],[`2(7${x} + 1) = (${x} + 3)${sp(2)}`,'Logaritmo inyectivo: argumentos iguales'],[`${x}${sp(2)} − 8${x} + 7 = 0`,'Desarrollamos y agrupamos'],[`${x} = 1 &nbsp;o&nbsp; ${x} = 7`,'Ambos verifican: los argumentos quedan positivos']]]];
  E19.forEach(([l,ex,a,st],k)=>{const s=sub(c19,l,ex);checker(s,{id:'19'+'abcdef'[k],ans:a});stepper(s,st)});
})();

<script>
"use strict";
/* ======================================================================
   HERRAMIENTAS COMPARTIDAS (guías 2 a 6)
   ====================================================================== */
const V=n=>`<span class="vec"><i>${n}</i></span>`;           // vector con flecha (dibujada con CSS)
const lim=(to,body)=>`<span class="lim"><span>lím</span><small>${to}</small></span>${body}`;
const uid=()=>Math.random().toString(36).slice(2,9);
const fx=(v,d=3)=>fmt(v,d);
const tuple=a=>'('+a.map(v=>fmt(v,3)).join('; ')+')';

/* ---------- intérprete de expresiones ---------- */
const FN={sen:Math.sin,sin:Math.sin,cos:Math.cos,tg:Math.tan,tan:Math.tan,ln:Math.log,log:Math.log10,lg:Math.log10,sqrt:Math.sqrt,raiz:Math.sqrt,abs:Math.abs,exp:Math.exp,cbrt:Math.cbrt,
  sec:v=>1/Math.cos(v),cosec:v=>1/Math.sin(v),csc:v=>1/Math.sin(v),cotg:v=>1/Math.tan(v),cot:v=>1/Math.tan(v),ctg:v=>1/Math.tan(v),
  arcsen:Math.asin,arcsin:Math.asin,arccos:Math.acos,arctg:Math.atan,arctan:Math.atan};
const NAMES=Object.keys(FN).concat(['pi','x','y','z','t','a','h','e','r','n','p','c','b']).sort((a,b)=>b.length-a.length);
function pw(b,e){if(b<0&&!Number.isInteger(e)){for(let q=3;q<=15;q+=2){const p=e*q;if(Math.abs(p-Math.round(p))<1e-9){const r=Math.pow(-b,e);return Math.round(p)%2?-r:r}}return NaN}return Math.pow(b,e)}
function tokenize(s){
  s=s.replace(/[−–]/g,'-').replace(/[·×⋅]/g,'*').replace(/π/g,' pi ').replace(/²/g,'^2').replace(/³/g,'^3').replace(/\*\*/g,'^').replace(/[\[{]/g,'(').replace(/[\]}]/g,')')
     .normalize('NFD').replace(/[̀-ͯ]/g,'');
  const T=[];let i=0;
  while(i<s.length){const ch=s[i];
    if(/\s/.test(ch)){i++;continue}
    const m=s.slice(i).match(/^(\d+([.,]\d+)?|[.,]\d+)/);
    if(m){T.push({t:'num',n:parseFloat(m[0].replace(',','.'))});i+=m[0].length;continue}
    if(/[a-zA-Z]/.test(ch)){let w=s.slice(i).match(/^[a-zA-Z]+/)[0];i+=w.length;w=w.toLowerCase();
      while(w){const nm=NAMES.find(n=>w.startsWith(n));if(!nm)throw Error(`No reconozco “${w}”`);T.push(FN[nm]?{t:'fn',v:nm}:{t:'id',v:nm});w=w.slice(nm.length)}continue}
    if(ch==='√'){T.push({t:'fn',v:'sqrt'});i++;continue}
    if(ch==='∛'){T.push({t:'fn',v:'cbrt'});i++;continue}
    if('+-*/^()|'.includes(ch)){T.push({t:'op',v:ch});i++;continue}
    if(ch==="'"){i++;continue}
    throw Error(`Símbolo “${ch}” no válido`)}
  return T}
function compile(src,vars=['x']){
  const T=tokenize(src);let p=0,abs=0;const peek=()=>T[p],nx=()=>T[p++];
  const is=v=>T[p]&&T[p].t==='op'&&T[p].v===v;
  function expect(v){if(is(v)){p++;return}throw Error(`Falta “${v}”`)}
  function expr(){let a=term();while(is('+')||is('-')){const o=nx().v,b=term(),l=a;a=o==='+'?E=>l(E)+b(E):E=>l(E)-b(E)}return a}
  const starts=t=>t&&(t.t==='num'||t.t==='id'||t.t==='fn'||(t.t==='op'&&(t.v==='('||(t.v==='|'&&abs===0))));
  function term(){let a=unary();for(;;){if(is('*')||is('/')){const o=nx().v,b=unary(),l=a;a=o==='*'?E=>l(E)*b(E):E=>l(E)/b(E)}else if(starts(peek())){const b=power(),l=a;a=E=>l(E)*b(E)}else break}return a}
  function unary(){if(is('-')){nx();const a=unary();return E=>-a(E)}if(is('+')){nx();return unary()}return power()}
  function power(){const b=primary();if(is('^')){nx();const e=unary();return E=>pw(b(E),e(E))}return b}
  function primary(){const t=nx();if(!t)throw Error('La expresión está incompleta');
    if(t.t==='num')return()=>t.n;
    if(t.t==='id'){if(t.v==='pi')return()=>Math.PI;if(t.v==='e'&&!vars.includes('e'))return()=>Math.E;
      if(!vars.includes(t.v))throw Error(`La letra “${t.v}” no corresponde acá`);const k=t.v;return E=>E[k]}
    if(t.t==='fn'){const f=FN[t.v];let ex=null;if(is('^')){nx();ex=is('(')?(nx(),(()=>{const r=expr();expect(')');return r})()):unary()}
      let a;if(is('(')){nx();a=expr();expect(')')}else a=power();
      return ex?E=>pw(f(a(E)),ex(E)):E=>f(a(E))}
    if(t.t==='op'&&t.v==='('){const r=expr();expect(')');return r}
    if(t.t==='op'&&t.v==='|'){abs++;const r=expr();expect('|');abs--;return E=>Math.abs(r(E))}
    throw Error(`No esperaba “${t.v}”`)}
  const r=expr();if(p<T.length)throw Error(`Sobra “${T[p].v??T[p].n}”`);return r}
function numOf(s){s=s.trim().replace(/^[a-z]\s*=/i,'');return compile(s,[])({})}
function stripLhs(s){const k=s.indexOf('=');if(k<0)return s;const L=s.slice(0,k).replace(/\s/g,'');if(/^([a-zA-Z]'*(\^?-?1)?(\([a-z]\))?|y|[a-z]'+|\([a-z]∘[a-z]\)\([a-z]\))$/.test(L)||/^[a-zA-Z]'*\(/.test(L))return s.slice(k+1);return s}

/* ---------- comprobadores genéricos ---------- */
function genCheck(parent,{id,label,hint,test}){
  reg(id);const box=H('div',{class:'chk'});
  box.innerHTML=`<label for="in-${id}">${label||'Tu respuesta'}</label><div class="chk-row"><input id="in-${id}" type="text" autocomplete="off" spellcheck="false" placeholder="${hint||''}"><button class="btn" type="button">Comprobar</button></div><p class="fb" aria-live="polite"></p>`;
  const inp=$('input',box),fb=$('.fb',box);
  function go(){const raw=inp.value.trim();fb.className='fb';if(!raw){fb.textContent='Escribí tu respuesta para comprobarla.';return}
    let r;try{r=test(raw)}catch(e){r={ok:false,msg:'No pude leerlo: '+e.message+'.'}}
    if(r.ok){fb.className='fb ok';fb.innerHTML='¡Correcto!'+(r.msg?' '+r.msg:'');markSolved(id)}else{fb.className='fb bad';fb.innerHTML=r.msg||'No coincide. Revisá la resolución.'}}
  $('button',box).onclick=go;inp.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
  if(solved.has(id)){fb.className='fb ok';fb.textContent='Ya lo resolviste antes.'}
  parent.appendChild(box);return box}
const near=(a,b,tol=1e-3)=>Math.abs(a-b)<=tol*Math.max(1,Math.abs(b));
function numCheck(parent,{id,ans,tol=2e-3,any,label,hint}){
  return genCheck(parent,{id,label:label||(ans.length>1&&!any?'Tu respuesta (separá los valores con ;)':'Tu respuesta'),hint:hint||'Ej: 3,5 ; 2√5 ; 24/7',test:raw=>{
    const vals=raw.split(/;|\s+y\s+|\s+o\s+/i).map(v=>v.trim()).filter(Boolean).map(numOf);
    if(vals.some(v=>!isFinite(v)))return{ok:false,msg:'Hay un valor que no es un número real.'};
    if(any)return vals.some(v=>ans.some(a=>near(v,a,tol)))?{ok:true}:{ok:false,msg:'Ese valor no coincide. Revisá los pasos.'};
    const hit=ans.filter(a=>vals.some(v=>near(v,a,tol))).length,extra=vals.filter(v=>!ans.some(a=>near(v,a,tol))).length;
    if(hit===ans.length&&!extra)return{ok:true};
    if(hit&&!extra)return{ok:false,msg:`Vas bien: tenés ${hit} de ${ans.length} valores.`};
    return{ok:false,msg:hit?`${hit} correcto(s), pero sobra algún valor.`:'No coincide. Revisá la cuenta o mirá la resolución.'}}})}
function parseTuple(raw){let s=raw.trim().replace(/^[a-z]+\s*=\s*/i,'').replace(/^[(<\[]|[)>\]]$/g,'');const parts=s.includes(';')?s.split(';'):s.split(/\s+/);return parts.map(v=>numOf(v))}
function vecCheck(parent,{id,ans,alts=[],parallel,tol=1e-2,label,hint}){
  return genCheck(parent,{id,label:label||'Tu respuesta',hint:hint||(ans.length===3?'(a; b; c)':'(a; b)'),test:raw=>{
    const v=parseTuple(raw);if(v.length!==ans.length)return{ok:false,msg:`Escribí ${ans.length} componentes separadas por punto y coma.`};
    if(v.some(q=>!isFinite(q)))return{ok:false,msg:'Alguna componente no es un número.'};
    if(parallel){const cr=ans.length===3?[v[1]*ans[2]-v[2]*ans[1],v[2]*ans[0]-v[0]*ans[2],v[0]*ans[1]-v[1]*ans[0]]:[v[0]*ans[1]-v[1]*ans[0]];
      if(v.every(q=>Math.abs(q)<1e-9))return{ok:false,msg:'El vector nulo no sirve.'};
      return cr.every(q=>Math.abs(q)<1e-6*Math.max(1,...v.map(Math.abs)))?{ok:true,msg:'Cualquier múltiplo no nulo sirve.'}:{ok:false,msg:'No es perpendicular a los dos vectores. Probá con el producto vectorial.'}}
    const eq=a=>a.every((q,i)=>near(v[i],q,tol));
    return eq(ans)||alts.some(eq)?{ok:true}:{ok:false,msg:'Alguna componente no coincide.'}}})}
function fnCheck(parent,{id,ref,vars=['x'],label,hint,xs,env={},envs}){
  const X=xs||[-2.7,-1.9,-1.3,-0.7,-0.35,0.3,0.6,1.1,1.45,2.2,2.9,3.7,4.6,6.3];
  return genCheck(parent,{id,label:label||'Tu respuesta',hint:hint||'Ej: 3x^2 - sen(2x)/x',test:raw=>{
    const g=compile(stripLhs(raw),vars);let n=0;
    const EN=envs||X.map(x0=>{const E={x:x0,t:x0,a:2,h:0.7,...env};E[vars[0]]=x0;return E});
    for(const E of EN){const x0=E[vars[0]];let r;try{r=ref(E)}catch(e){r=NaN}if(!isFinite(r))continue;
      const u=g(E);if(!isFinite(u)||Math.abs(u-r)>1e-4*Math.max(1,Math.abs(r)))return{ok:false,msg:`No coincide: por ejemplo en ${vars[0]} = ${fmt(x0,2)} tu expresión vale ${isFinite(u)?fmt(u,4):'algo no definido'} y debería dar ${fmt(r,4)}.`};n++}
    return n>=3?{ok:true,msg:'Es equivalente a la respuesta esperada.'}:{ok:false,msg:'No pude comparar suficientes valores.'}}})}
function eqCheck(parent,{id,vars=['x','y'],on,off,label,hint}){
  return genCheck(parent,{id,label:label||'Tu ecuación',hint:hint||'Ej: y = 2x - 3   o   2x - y - 3 = 0',test:raw=>{
    const k=raw.split('=');if(k.length>2)return{ok:false,msg:'Usá un solo signo =.'};
    const L=compile(k[0],vars),R=k.length>1?compile(k[1],vars):()=>0,F=E=>L(E)-R(E);
    const offv=off.map(E=>Math.abs(F(E))),sc=Math.max(...offv.filter(isFinite));
    if(!(sc>1e-9))return{ok:false,msg:'Tu ecuación se cumple en puntos que no deberían estar. Revisala.'};
    const bad=on.find(E=>{const v=F(E);return!isFinite(v)||Math.abs(v)>1e-6*sc*10});
    if(bad)return{ok:false,msg:`El punto (${vars.map(q=>fmt(bad[q],2)).join('; ')}) debería cumplir la ecuación y no la cumple.`};
    return{ok:true,msg:'Tu ecuación describe el mismo lugar geométrico.'}}})}
function limCheck(parent,{id,ans,label}){
  return genCheck(parent,{id,label:label||'Valor del límite',hint:'número, ∞, -∞ o “no existe”',test:raw=>{
    const s=raw.toLowerCase().replace(/\s/g,'');let v;
    if(/^(no|ne|noexiste|∄)/.test(s))v='ne';else if(/^(\+?∞|\+?inf|\+?infinito)$/.test(s))v=Infinity;else if(/^(-∞|-inf|-infinito)$/.test(s))v=-Infinity;else v=numOf(raw);
    if(ans==='ne')return v==='ne'?{ok:true}:{ok:false,msg:'Revisá los límites laterales: ¿dan lo mismo?'};
    if(v==='ne')return{ok:false,msg:'El límite sí existe (aunque puede ser infinito).'};
    if(!isFinite(ans))return v===ans?{ok:true}:{ok:false,msg:'Revisá el signo y si crece sin cota.'};
    return isFinite(v)&&near(v,ans,1e-3)?{ok:true}:{ok:false,msg:'No coincide. Probá el explorador de valores.'}}})}

/* ---------- gráficos ---------- */
function ticks(a,b,s){const r=[];for(let v=Math.ceil(a/s-1e-9)*s;v<=b+1e-9;v+=s)r.push(+v.toFixed(6));return r}
function G(svg,o){
  const A=plot(svg,{...o,xticks:o.xt||ticks(o.xmin,o.xmax,o.xs||1),yticks:o.yt||ticks(o.ymin,o.ymax,o.ys||1),W:o.W||560,H:o.H||340});
  A.o=o;A.iX=sx=>o.xmin+(sx-A.m.l)/(A.W-A.m.l-A.m.r)*(o.xmax-o.xmin);A.iY=sy=>o.ymin+(A.H-A.m.b-sy)/(A.H-A.m.t-A.m.b)*(o.ymax-o.ymin);
  const cid='cl'+uid(),cp=S('clipPath',{id:cid},svg);S('rect',{x:A.m.l,y:A.m.t,width:A.W-A.m.l-A.m.r,height:A.H-A.m.t-A.m.b},cp);
  A.g=S('g',{'clip-path':`url(#${cid})`},svg);A.top=S('g',{},svg);A.svg=svg;

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function stepQuiz(parent,{id,steps}){
  reg(id);
  const box=H('div',{class:'pp'});
  box.innerHTML=`<div class="pp-top"><div class="pp-dots"></div><span class="pp-err"></span></div><ol class="pp-chain"></ol>
   <div class="pp-cur"><div class="pp-q"></div><div class="pp-opts"></div><p class="fb" aria-live="polite"></p></div><div class="pp-end" hidden></div>`;
  parent.appendChild(box);
  const dots=$('.pp-dots',box),chain=$('.pp-chain',box),cur=$('.pp-cur',box),q=$('.pp-q',box),opts=$('.pp-opts',box),fb=$('.fb',box),end=$('.pp-end',box),errEl=$('.pp-err',box);
  let i=0,err=0;
  steps.forEach(()=>dots.appendChild(H('span')));
  function render(){[...dots.children].forEach((d,k)=>{d.className=k<i?'done':k===i?'now':''});errEl.textContent=err?`${err} error${err>1?'es':''}`:'';
    if(i>=steps.length){finish();return}
    const st=steps[i];q.innerHTML=`<span class="pp-n">Paso ${i+1} de ${steps.length}</span>${st.p}`;opts.innerHTML='';fb.className='fb';fb.textContent='';
    shuffle(st.o.map((o,k)=>[o,k])).forEach(([o,k],n)=>{const b=H('button',{class:'pp-opt',type:'button'},o[0]);b.style.animationDelay=(n*60)+'ms';
      b.onclick=()=>{if(k===0){b.classList.add('right');opts.querySelectorAll('button').forEach(x=>x.disabled=true);
          const li=H('li',{class:'pp-step'},`<div class="pp-a">${o[0]}</div>${o[1]?`<div class="pp-r">${o[1]}</div>`:''}`);chain.appendChild(li);i++;setTimeout(()=>{cur.classList.add('swap');setTimeout(()=>{cur.classList.remove('swap');render()},220)},380)}
        else{err++;errEl.textContent=`${err} error${err>1?'es':''}`;b.classList.add('wrong');b.disabled=true;fb.className='fb bad';fb.innerHTML=o[1]||'Ese no es el paso correcto.'}};
      opts.appendChild(b)})}
  function finish(){cur.hidden=true;end.hidden=false;end.innerHTML=`<div class="pp-done">${err?`Resuelto con ${err} error${err>1?'es':''}.`:'¡Perfecto! Resuelto sin errores.'}</div>`;
    const rb=H('button',{class:'btn ghost',type:'button'},'Resolver de nuevo');rb.onclick=()=>{i=0;err=0;chain.innerHTML='';cur.hidden=false;end.hidden=true;render()};end.appendChild(rb);markSolved(id)}
  render();return box}

   ['A ∪ B = {x / x ≤ −3 o −8 &lt; x ≤ 4} = (−∞; 4]','Elementos que están en A o en B'],

exSection('xvec','Vectores',EXI,[
 {t:'Ortogonal, ángulo y unitario',src:'Recuperatorio 04/07/2023 · Recuperatorio integrador',en:'u = −2i + j + 3k y v = (3; −1; 2).',it:[
  ['a)','Un vector ortogonal a u y a v.',[
   [`u × v = ${DET('−2 1 3','3 −1 2')}`,'El producto vectorial es perpendicular a ambos'],
   ['i: 1 · 2 − 3 · (−1) = 5',''],
   ['j: −[(−2) · 2 − 3 · 3] = −(−4 − 9) = 13','La componente j lleva signo menos'],
   ['k: (−2)(−1) − 1 · 3 = −1',''],
   ['u × v = (5; 13; −1)','Verificación: u · (5; 13; −1) = −10 + 13 − 3 = 0 ✓ ; v · (5; 13; −1) = 15 − 13 − 2 = 0 ✓']]],
  ['b)','El ángulo que determinan u y v.',[
   ['u · v = (−2)(3) + 1 · (−1) + 3 · 2 = −1',''],
   ['|u| = √(4 + 1 + 9) = √14 ; |v| = √(9 + 1 + 4) = √14',''],
   ['cos θ = −1 / (√14 · √14) = −1/14',''],
   ['θ = arccos(−1/14) ≈ 94,10°','']]],
  ['c)','Un vector unitario paralelo a u − v.',[
   ['u − v = (−2 − 3; 1 + 1; 3 − 2) = (−5; 2; 1)',''],
   ['|u − v| = √(25 + 4 + 1) = √30',''],
   ['ê = (−5/√30; 2/√30; 1/√30)','También sirve el opuesto']]]]},
 {t:'Unitario perpendicular a dos vectores',src:'1er parcial (naves pesqueras)',en:'a = (2; −1; 1) y b = (−3; 1; −2). Encontrar un vector unitario perpendicular a ambos.',it:[
  ['','Resolución',[
   [`a × b = ${DET('2 −1 1','−3 1 −2')}`,''],
   ['i: (−1)(−2) − 1 · 1 = 1 ; j: −[2 · (−2) − 1 · (−3)] = 1 ; k: 2 · 1 − (−1)(−3) = −1',''],
   ['a × b = (1; 1; −1)','Verificación: a · (1; 1; −1) = 2 − 1 − 1 = 0 ✓ ; b · (1; 1; −1) = −3 + 1 + 2 = 0 ✓'],
   ['|a × b| = √3',''],
   ['ê = (1/√3; 1/√3; −1/√3) (o su opuesto)','Dividimos por el módulo']]]]},
 {t:'Vector paralelo con longitud dada',src:'Examen libre',en:'u = 3i + k y v = −i + j. Hallar un vector paralelo a u − 2v que tenga longitud 3.',it:[
  ['','Resolución',[
   ['u = (3; 0; 1) ; v = (−1; 1; 0)',''],
   ['u − 2v = (3 + 2; 0 − 2; 1 − 0) = (5; −2; 1)',''],
   ['|u − 2v| = √(25 + 4 + 1) = √30',''],
   ['w = 3 · (5; −2; 1)/√30 = (15/√30; −6/√30; 3/√30)','Unitario multiplicado por 3; el opuesto también es paralelo']]]]},
 {t:'Perpendicular en el plano con longitud dada',src:'Recuperatorio 1er parcial Farmacia 05/07/2022',en:'Dado u = i + 2j, encontrar un vector perpendicular cuya longitud sea 5 y graficar.',it:[
  ['','Resolución',[
   ['Un perpendicular a (a; b) es (−b; a): (−2; 1)','(1; 2) · (−2; 1) = −2 + 2 = 0'],
   ['|(−2; 1)| = √5',''],
   ['w = 5 · (−2; 1)/√5 = (−2√5; √5)','Longitud: √(20 + 5) = 5 ✓ (también sirve (2√5; −√5))'],
   ['Gráfico: u desde el origen hasta (1; 2) y w hasta (−2√5; √5) ≈ (−4,47; 2,24), formando 90°','']]]]},
 {t:'Parámetro para paralelismo y perpendicularidad',src:'Recuperatorio 1er parcial Farmacia 05/07/2022',en:'u = (1; −2a; 1) y v = (2; 1; 2).',it:[
  ['a)','Calcular a para que u sea paralelo a v.',[
   ['u = k · v → (1; −2a; 1) = (2k; k; 2k)','Paralelos: uno es múltiplo del otro'],
   ['1 = 2k → k = 1/2 (la tercera componente también da 1 = 2k ✓)',''],
   ['−2a = k = 1/2 → a = −1/4','']]],
  ['b)','Calcular a para que u sea perpendicular a v.',[
   ['u · v = 0','Perpendiculares ⇔ producto escalar nulo'],
   ['1 · 2 + (−2a) · 1 + 1 · 2 = 0 → 4 − 2a = 0',''],
   ['a = 2','']]],
  ['c)','Con el valor de a hallado en b), obtener |u|.',[
   ['u = (1; −4; 1)',''],
   ['|u| = √(1 + 16 + 1) = √18 = 3√2 ≈ 4,24','']]]]},
 {t:'Módulo y combinación lineal',src:'1er parcial',en:'v = −4i + j + 2k y u = (1/2; −3; −1).',it:[
  ['a)','‖−2u‖',[
   ['‖−2u‖ = |−2| · ‖u‖ = 2‖u‖',''],
   ['‖u‖ = √(1/4 + 9 + 1) = √(41/4) = √41/2',''],
   ['‖−2u‖ = √41 ≈ 6,40','']]],
  ['b)','3v − u',[
   ['3v = (−12; 3; 6)',''],
   ['3v − u = (−12 − 1/2; 3 + 3; 6 + 1) = (−25/2; 6; 7)','']]]]},
 {t:'Vectores en el plano y proyección',src:'1er parcial Bioquímica 22/10/2024',en:'a = 9i + 2j ; b = 5i − j.',it:[
  ['a)','Representar el vector fijo de la familia de b y un representante libre de la familia de a.',[
   ['Vector fijo de b: flecha desde el origen (0; 0) hasta (5; −1)',''],
   ['Representante libre de a: flecha desde cualquier punto P, por ejemplo P(1; 1), hasta P + a = (10; 3)','Todos los representantes son paralelos, de igual módulo y sentido']]],
  ['b)','Un vector unitario en la dirección de −a.',[
   ['−a = (−9; −2)',''],
   ['|a| = √(81 + 4) = √85',''],
   ['ê = (−9/√85; −2/√85)','']]],
  ['c)','(4/3)a − b',[
   ['(4/3)a = (12; 8/3)',''],
   ['(4/3)a − b = (12 − 5; 8/3 + 1) = (7; 11/3)','']]],
  ['d)','La proyección del vector hallado en c) sobre b. ¿Qué representa?',[
   ['c · b = 7 · 5 + (11/3)(−1) = 35 − 11/3 = 94/3','Llamamos c = (7; 11/3)'],
   ['|b| = √26',''],
   ['Proyección escalar: c · b / |b| = 94/(3√26) ≈ 6,15','Es la longitud de la “sombra” de c sobre la dirección de b'],
   ['Vector proyección: (c · b/|b|²) · b = (47/39)(5; −1) = (235/39; −47/39) ≈ (6,03; −1,21)','Es la componente de c en la dirección de b']]]]},
 {t:'Área de un triángulo y ángulo',src:'1er parcial Bioquímica 22/10/2024',en:'A(−2; −1; 4), B(0; 4; −1) y C(2; −1; 9) son los vértices de un triángulo.',it:[
  ['a)','El área del triángulo ABC (usando vectores).',[
   ['AB = B − A = (2; 5; −5) ; AC = C − A = (4; 0; 5)',''],
   ['i: 5 · 5 − (−5) · 0 = 25 ; j: −[2 · 5 − (−5) · 4] = −30 ; k: 2 · 0 − 5 · 4 = −20','Producto vectorial AB × AC'],
   ['AB × AC = (25; −30; −20)',''],
   ['|AB × AC| = √(625 + 900 + 400) = √1925 = 5√77 ≈ 43,87','Es el área del paralelogramo'],
   ['Área = ½ |AB × AC| = 5√77/2 ≈ 21,94','']]],
  ['b)','El ángulo comprendido entre AB y AC.',[
   ['AB · AC = 2 · 4 + 5 · 0 + (−5) · 5 = −17',''],
   ['|AB| = √54 = 3√6 ; |AC| = √41',''],
   ['cos θ = −17/(√54 · √41) = −17/√2214 ≈ −0,3613',''],
   ['θ ≈ 111,18°','']]]]},
 {t:'Origen de un vector y vector ortogonal',src:'1er parcial Bioquímica',en:'RS = (−3/2; 1) y su extremo es S(2; −1).',it:[
  ['a)','Determinar el origen R.',[
   ['RS = S − R → R = S − RS',''],
   ['R = (2 + 3/2; −1 − 1) = (7/2; −2)','Verificación: S − R = (2 − 7/2; −1 + 2) = (−3/2; 1) ✓']]],
  ['b)','Representar el vector fijo de la familia de vectores opuestos a RS.',[
   ['−RS = (3/2; −1)',''],
   ['Vector fijo: flecha desde el origen hasta (3/2; −1)','']]],
  ['c)','Componentes de un vector v ortogonal a RS.',[
   ['v = (a; b) con v · RS = 0 → −3a/2 + b = 0 → b = 3a/2',''],
   ['Con a = 2: v = (2; 3)','Verificación: (−3/2) · 2 + 1 · 3 = 0 ✓ (cualquier múltiplo sirve)']]]]},
 {t:'Dos naves pesqueras',src:'1er parcial',en:'Dos naves salen del mismo puerto: una hacia el Este a 3 millas/h y otra hacia el Sur a 2 millas/h. Calcular la longitud del vector que determinan ambos navíos luego de 2 horas.',it:[
  ['','Resolución',[
   ['Tras 2 h, la nave del Este recorrió 3 · 2 = 6 millas → E = (6; 0)','Origen en el puerto, eje x hacia el Este'],
   ['La nave del Sur recorrió 2 · 2 = 4 millas → S = (0; −4)','Eje y hacia el Norte'],
   ['Vector entre ambas: E − S = (6; 4)',''],
   ['Longitud: √(36 + 16) = √52 = 2√13 ≈ 7,21 millas','Es la distancia entre los barcos']]]]},
 {t:'Conceptos y verdadero o falso',src:'Parciales 2024 y 2025',en:'Justificar cada respuesta.',it:[
  ['a)','¿Cuándo dos vectores son perpendiculares? ¿Y paralelos?',[
   ['Perpendiculares ⇔ u · v = 0','El coseno del ángulo es 0: θ = 90°'],
   ['Paralelos ⇔ u = k · v para algún k ≠ 0 (en el espacio, u × v = 0)','Componentes proporcionales']]],
  ['b)','V o F: el producto escalar de dos vectores es un vector.',[
   ['u · v = u₁v₁ + u₂v₂ + u₃v₃ es una suma de números','FALSO: el resultado es un escalar']]],
  ['c)','V o F: si k es un escalar, kv tiene longitud |k| · |v| y siempre el mismo sentido que v.',[
   ['|kv| = |k| · |v|','La parte de la longitud es correcta'],
   ['Si k &lt; 0, kv tiene sentido opuesto (por ejemplo −1 · v = −v)','FALSO: el sentido depende del signo de k']]],
  ['d)','V o F: si u · (u × v) = 0, entonces u × v es ortogonal a u y también a v.',[
   ['u × v es siempre perpendicular a u y a v','Propiedad del producto vectorial'],
   ['Por eso u · (u × v) = 0 y v · (u × v) = 0 siempre','VERDADERO']]]]}]);

exSection('xrec','Rectas, planos y cónicas',EXI,[
 {t:'Recta por dos puntos',src:'1er parcial Farmacia 24/05/2025',en:'P(−1; 3) y Q(0; −2).',it:[
  ['a)','Ecuaciones vectorial y explícita de la recta.',[
   ['PQ = Q − P = (1; −5)','Vector director'],
   ['(x; y) = (−1; 3) + t(1; −5)','Ecuación vectorial'],
   ['m = −5/1 = −5','Pendiente'],
   ['y − 3 = −5(x + 1) → y = −5x − 2','Explícita (con Q: −5 · 0 − 2 = −2 ✓)']]],
  ['b)','Puntos de intersección con los ejes y gráfico.',[
   ['Eje y (x = 0): y = −2 → (0; −2)',''],
   ['Eje x (y = 0): 0 = −5x − 2 → x = −2/5 → (−2/5; 0)',''],
   ['Gráfico: recta decreciente que pasa por (−1; 3), (−2/5; 0) y (0; −2)','']]]]},
 {t:'Recta paralela a un vector con parámetros',src:'1er parcial Farmacia 30/10/2025',en:'Hallar la ecuación explícita de la recta que pasa por (0; b) y es paralela a v = (a; −b).',it:[
  ['','Resolución',[
   ['m = −b/a (con a ≠ 0)','Pendiente = Δy/Δx del director'],

 {t:'De paramétrica a general y segmentaria',src:'1er parcial Bioquímica (dos temas)',en:'Pasar cada recta a la forma pedida.',it:[
  ['a)','Ecuación general de r: x = −3 + 2λ ; y = 7 − 5λ',[
   ['λ = (x + 3)/2','Despejamos λ de la primera ecuación'],
   ['y = 7 − 5(x + 3)/2','Sustituimos en la segunda'],
   ['2y = 14 − 5x − 15 → 5x + 2y + 1 = 0','General (con (−3; 7): −15 + 14 + 1 = 0 ✓)']]],
  ['b)','Ecuación segmentaria de r: x = −1 − 2λ ; y = 2 − 4λ',[
   ['Director (−2; −4) → m = −4/(−2) = 2 ; punto (−1; 2)',''],
   ['y − 2 = 2(x + 1) → y = 2x + 4',''],
   ['2x − y = −4 → dividimos por −4',''],
   [`${F('x','−2')} + ${F('y',4)} = 1`,'Corta al eje x en −2 y al eje y en 4']]]]},
 {t:'Recta en el espacio',src:'2do parcial Bioquímica 11/2024',en:'m: x = −3 + 2λ ; y = 7 − 5λ ; z = 1 − 3λ.',it:[
  ['a)','Punto y vector director usados en la ecuación paramétrica.',[
   ['P₀ = (−3; 7; 1)','Términos independientes (λ = 0)'],
   ['v = (2; −5; −3)','Coeficientes de λ']]],
  ['b)','Dos puntos que pertenecen a la recta.',[
   ['λ = 1: (−1; 2; −2)',''],
   ['λ = −1: (−5; 12; 4)','']]],
  ['c)','Ecuación simétrica. ¿El punto A(−3; 7; 1) pertenece a la recta?',[
   [`${F('x + 3',2)} = ${F('y − 7','−5')} = ${F('z − 1','−3')}`,'Despejamos λ de cada ecuación'],
   ['A: 0/2 = 0/(−5) = 0/(−3) = 0 ✓','Sí pertenece: es el punto con λ = 0']]]]},
 {t:'Planos',src:'1er parcial Bioquímica',en:'DE = (−1; −4; 0) y DF = (0; 2; −2).',it:[
  ['a)','Un vector n perpendicular al plano que forman DE y DF.',[
   [`n = DE × DF = ${DET('−1 −4 0','0 2 −2')}`,''],
   ['i: (−4)(−2) − 0 · 2 = 8 ; j: −[(−1)(−2) − 0 · 0] = −2 ; k: (−1) · 2 − (−4) · 0 = −2',''],
   ['n = (8; −2; −2), o su paralelo (4; −1; −1)','Verificación: DE · n = −8 + 8 + 0 = 0 ✓ ; DF · n = 0 − 4 + 4 = 0 ✓']]],
  ['b)','Ecuación vectorial del plano que contiene a P(−2; 5; 1) y es perpendicular a DE.',[
   ['Normal n = DE = (−1; −4; 0)','El vector perpendicular al plano es su normal'],
   ['(−1; −4; 0) · (x + 2; y − 5; z − 1) = 0','Vectorial: n · (X − P) = 0'],
   ['−x − 2 − 4y + 20 = 0 → x + 4y − 18 = 0','General']]]]},
 {t:'Circunferencia por un diámetro',src:'1er parcial Bioquímica',en:'Ecuación canónica de la circunferencia que tiene un diámetro determinado por A(−2; 1) y B(1; 4).',it:[
  ['','Resolución',[
   ['Centro = punto medio de AB = ((−2 + 1)/2; (1 + 4)/2) = (−1/2; 5/2)',''],
   ['|AB| = √(3² + 3²) = 3√2 → r = 3√2/2','El radio es medio diámetro'],
   ['r² = 18/4 = 9/2',''],
   ['(x + 1/2)² + (y − 5/2)² = 9/2','Canónica']]]]},
 {t:'Circunferencia con condiciones',src:'1er parcial Bioquímica',en:'Circunferencia de radio 4 que pasa por el origen y cuyo centro tiene ordenada k = 3.',it:[
  ['','Resolución',[
   ['(x − h)² + (y − 3)² = 16','Centro (h; 3), radio 4'],
   ['Pasa por (0; 0): h² + 9 = 16 → h² = 7 → h = ±√7',''],
   ['(x − √7)² + (y − 3)² = 16 o (x + √7)² + (y − 3)² = 16','Hay dos circunferencias posibles']]]]}]);

/* ---------- 4 · funciones y modelos ---------- */
exSection('xfun','Funciones y modelos',EXI,[
 {t:'Composición e inversa',src:'Recuperatorio 04/07/2023',en:'f: ℝ → ℝ / f(x) = 2x − 1 y g: ℝ → ℝ / g(x) = ∛x.',it:[
  ['a)','Hallar f ∘ g y/o g ∘ f cuando sea posible.',[
   ['Dom f = Im f = ℝ ; Dom g = Im g = ℝ','La raíz cúbica está definida para todo real'],
   ['(f ∘ g)(x) = f(∛x) = 2∛x − 1','Existe: Im g ⊆ Dom f'],
   ['(g ∘ f)(x) = g(2x − 1) = ∛(2x − 1)','Existe: Im f ⊆ Dom g'],
   ['Ambas tienen dominio ℝ: no hace falta modificar nada','']]],
  ['b)','¿Es posible hallar la inversa de g? Si no, indicar qué cambiar.',[
   ['g(x) = ∛x es estrictamente creciente (inyectiva) y su imagen es ℝ (suryectiva)','Es biyectiva de ℝ en ℝ'],
   ['y = ∛x → x = y³',''],
   ['g⁻¹(x) = x³','No hay que cambiar dominio ni codominio']]]]},
 {t:'Paridad y composición con restricciones',src:'2do parcial Bioquímica',en:'f(x) = √(x + 2) y g(x) = x − x³.',it:[
  ['a)','Estudiar la paridad de g.',[
   ['g(−x) = (−x) − (−x)³ = −x + x³',''],
   ['−g(x) = −x + x³ = g(−x)',''],
   ['g es impar: simétrica respecto del origen','']]],
  ['b)','Hallar f ∘ g con las restricciones necesarias.',[
   ['(f ∘ g)(x) = √(x − x³ + 2)',''],
   ['Hace falta g(x) ∈ Dom f: x − x³ + 2 ≥ 0 → x³ − x − 2 ≤ 0',''],
   ['x³ − x − 2 tiene una sola raíz real x₀ ≈ 1,521','p(1,5) &lt; 0 &lt; p(1,53)'],
   ['Dom(f ∘ g) = (−∞; x₀] ≈ (−∞; 1,521]','Restringimos el dominio de g a ese intervalo']]]]},
 {t:'Logaritmo e inversa',src:'Recuperatorio 04/07/2023 · variante 2 ln(x − 1)',en:'f: D ⊂ ℝ → ℝ / f(x) = log₂(x + 3) + 1.',it:[
  ['a)','Dominio e imagen.',[
   ['x + 3 &gt; 0 → Dom f = (−3; +∞)','El argumento del logaritmo debe ser positivo'],
   ['Im f = ℝ','El logaritmo toma todos los valores reales']]],
  ['b)','Su inversa es: i) 2<sup>x−3</sup> + 1 &nbsp; ii) 2<sup>x+1</sup> − 3 &nbsp; iii) 2<sup>x−1</sup> − 3. Justificar.',[
   ['y = log₂(x + 3) + 1 → y − 1 = log₂(x + 3)',''],
   ['2<sup>y−1</sup> = x + 3 → x = 2<sup>y−1</sup> − 3','Definición de logaritmo'],
   ['f⁻¹(x) = 2<sup>x−1</sup> − 3: opción iii)','Verificación: f(f⁻¹(x)) = log₂(2<sup>x−1</sup>) + 1 = x ✓']]]]},
 {t:'Biyectividad e inversa',src:'Recuperatorio 2do parcial Farmacia 05/07/2022',en:'f: ℝ → ℝ definida por f(x) = √(x² − 4).',it:[
  ['a)','Obtener un dominio y un codominio para que sea biyectiva.',[
   ['x² − 4 ≥ 0 → dominio natural (−∞; −2] ∪ [2; +∞)',''],
   ['No es inyectiva: f(−3) = f(3) = √5','Es una función par'],
   ['Restringimos: f: [2; +∞) → [0; +∞)','Así es inyectiva y suryectiva']]],
  ['b)','Hallar la inversa y la composición de f con su inversa.',[
   ['y = √(x² − 4) → y² = x² − 4 → x = √(y² + 4) (x ≥ 2)',''],
   ['f⁻¹: [0; +∞) → [2; +∞), f⁻¹(x) = √(x² + 4)',''],
   ['(f ∘ f⁻¹)(x) = √((x² + 4) − 4) = √(x²) = x (x ≥ 0)','La composición da la identidad']]]]},
 {t:'Función trigonométrica',src:'Recuperatorio 2do parcial Farmacia 05/07/2022 · Examen libre',en:'f(x) = 3 sen(2x − 1). Hallar dominio, imagen, amplitud, período, desfasaje y ceros en un período.',it:[
  ['','Resolución',[
   ['Dominio ℝ ; imagen [−3; 3]','El seno varía entre −1 y 1'],
   ['Amplitud |A| = 3',''],
   ['Período 2π/|B| = 2π/2 = π',''],
   ['Desfasaje: 2x − 1 = 0 → x = 1/2 (se corre 1/2 a la derecha)',''],
   ['Ceros: 2x − 1 = kπ → x = (1 + kπ)/2, k entero',''],
   ['En el período [1/2; 1/2 + π): x = 1/2 y x = 1/2 + π/2','']]]]},
 {t:'Verdadero o falso sobre funciones',src:'1er parciales 2024 y 2025',en:'Justificar cada respuesta.',it:[
  ['a)','f(x) = x² − 4: el dominio es ℝ − {−2; 2}.',[
   ['x² − 4 es un polinomio: se calcula para todo x','FALSO: Dom f = ℝ']]],
  ['b)','f(x) = x² − 4 corta al eje de ordenadas en (0; −4) y no tiene raíces reales.',[
   ['f(0) = −4 → corta en (0; −4) ✓',''],
   ['x² − 4 = 0 → x = ±2','Sí tiene raíces: la afirmación es FALSA']]],
  ['c)','f(x) = x² − a con a ∈ ℝ es par.',[
   ['f(−x) = (−x)² − a = x² − a = f(x)','VERDADERO para todo a']]],
  ['d)',`f(x) = ${F('4 − x²','2 + x')}: Df = ℝ − {−2; 2}, corta al eje x en x = 2 y tiene asíntota vertical en x = −2.`,[
   ['Solo el denominador se anula en x = −2 → Df = ℝ − {−2}','Dominio: FALSO'],
   ['f(2) = 0/4 = 0 → corta al eje x en x = 2','VERDADERO'],
   ['f(x) = (2 − x)(2 + x)/(2 + x) = 2 − x si x ≠ −2 → lím x→−2 f(x) = 4','Asíntota: FALSO, hay un agujero en (−2; 4)']]],
  ['e)','La función lineal que pasa por (2; −1) y (6; 1) es decreciente.',[
   ['m = (1 − (−1))/(6 − 2) = 2/4 = 1/2',''],
   ['m &gt; 0 → es creciente','FALSO']]]]},
 {t:'Sustancia radiactiva',src:'Recuperatorio 04/07/2023 · Recuperatorio integrador',en:'Q(t) = 100e<sup>−0,035t</sup> mg quedan después de t años.',it:[
  ['a)','¿Cuáles son las variables?',[

 {t:'Eliminación de un fármaco',src:'1er parcial Farmacia 30/10/2025',en:'C(t) = C₀e<sup>−kt</sup>. Después de 12 horas, la cantidad inicial disminuyó un 7%.',it:[

 {t:'Enfriamiento del agua',src:'1er parcial 20/05/2024',en:'T(t) = 20 + 80e<sup>−0,41t</sup> (°C, t en minutos).',it:[
  ['a)','¿Cuáles son las variables?',[

 {t:'Crecimiento porcentual de bacterias',src:'1er parcial',en:'La masa de una población de bacterias aumenta un 15% cada hora. Al comienzo hay 50 g.',it:[

 {t:'Bombas de infusión',src:'1er parcial Farmacia 24/05/2025',en:'Paciente 1: medicamento A, jeringa de 60 mL a 1 mL/min. Paciente 2: medicamento B, jeringa de 100 mL a 2 mL/min.',it:[

 {t:'Población de peces',src:'1er parcial',en:'F(t) = 1000(30 + 17t − t²) peces, t en años desde el 1 de enero de 2002.',it:[

 {t:'Ecuaciones logarítmicas',src:'Recuperatorio 2do parcial Farmacia 05/07/2022',en:'Resolver.',it:[

exSection('xlim','Límites y continuidad',EXI,[
 {t:'Continuidad de una función por partes',src:'2do parcial (dos temas)',en:'f(x) = x² − 1 si x &lt; 1 ; 2x − 2 si 1 ≤ x &lt; 3 ; √(x + 1) si x ≥ 3. Analizar la continuidad en x = 1 y en x = 3.',it:[
  ['a)','En x = 1',[
   ['f(1) = 2 · 1 − 2 = 0','Tramo 1 ≤ x &lt; 3'],
   ['lím x→1⁻ (x² − 1) = 0 ; lím x→1⁺ (2x − 2) = 0',''],
   ['lím x→1 f(x) = 0 = f(1)','Es continua en x = 1']]],
  ['b)','En x = 3',[
   ['f(3) = √(3 + 1) = 2',''],
   ['lím x→3⁻ (2x − 2) = 4 ; lím x→3⁺ √(x + 1) = 2',''],
   ['Los laterales son distintos: el límite no existe','Discontinuidad de salto (no evitable)']]]]},
 {t:'Función por partes con raíz',src:'2do parcial Bioquímica 26/06/2025',en:'f(x) = √(x + 1) si x ≤ −1 ; 3x − 1 si −1 &lt; x &lt; 1 ; x² − 6x + 7 si x ≥ 1. Analizar la continuidad en x = −1 y en x = 1.',it:[
  ['a)','En x = −1',[
   ['f(−1) = √0 = 0',''],
   ['Para x &lt; −1, √(x + 1) no está definida','No hay valores de f a la izquierda de −1'],
   ['lím x→−1⁺ (3x − 1) = −4',''],
   ['−4 ≠ f(−1) = 0 → f no es continua en x = −1','Los valores cercanos tienden a −4 pero f(−1) = 0']]],
  ['b)','En x = 1',[
   ['f(1) = 1 − 6 + 7 = 2',''],
   ['lím x→1⁻ (3x − 1) = 2 ; lím x→1⁺ (x² − 6x + 7) = 2',''],
   ['Es continua en x = 1','']]]]},
 {t:'Estudio completo de una función racional',src:'2do parcial (dos temas)',en:`f(x) = ${F('3x − 6','x² − 9')}`,it:[
  ['a)','Dominio',[
   ['x² − 9 = 0 → x = ±3',''],
   ['Dom f = ℝ − {−3; 3}','']]],
  ['b)','Ceros y ordenada al origen',[
   ['3x − 6 = 0 → x = 2 (pertenece al dominio)','Cero'],
   ['f(0) = −6/(−9) = 2/3','Ordenada al origen']]],
  ['c)','Asíntotas (usando límites)',[
   ['En x = 3 el numerador vale 3 ≠ 0',''],
   ['lím x→3⁺ f = 3/0⁺ = +∞ ; lím x→3⁻ f = 3/0⁻ = −∞','Asíntota vertical x = 3'],
   ['En x = −3 el numerador vale −15 ≠ 0',''],
   ['lím x→−3⁻ f = −15/0⁺ = −∞ ; lím x→−3⁺ f = −15/0⁻ = +∞','Asíntota vertical x = −3'],
   ['lím x→±∞ (3x − 6)/(x² − 9) = 0','Grado del numerador menor: asíntota horizontal y = 0']]],
  ['d)','Esbozo del gráfico',[
   ['x &lt; −3: valores negativos que bajan a −∞ cerca de −3 y suben a 0 hacia −∞',''],
   ['−3 &lt; x &lt; 3: baja desde +∞, pasa por (0; 2/3) y (2; 0) y cae a −∞ cerca de 3',''],
   ['x &gt; 3: baja desde +∞ y se acerca a 0','']]]]},
 {t:'Estudio completo de otra función racional',src:'2do parcial Bioquímica 11/2024',en:`f(x) = ${F('x + 3','x² + x − 6')}`,it:[
  ['a)','Dominio, ceros, ordenada al origen y asíntotas',[
   ['x² + x − 6 = (x + 3)(x − 2) → Dom f = ℝ − {−3; 2}',''],
   ['x + 3 = 0 → x = −3, que no está en el dominio → no tiene ceros',''],
   ['Ordenada: f(0) = 3/(−6) = −1/2',''],
   ['Si x ≠ −3: f(x) = 1/(x − 2)','Simplificamos'],
   ['lím x→2⁺ f = +∞ ; lím x→2⁻ f = −∞ → asíntota vertical x = 2',''],
   ['lím x→−3 f = 1/(−5) = −1/5 (finito) → no hay asíntota en x = −3',''],
   ['lím x→±∞ f = 0 → asíntota horizontal y = 0','']]],
  ['b)','Esbozo del gráfico',[
   ['Es la gráfica de 1/(x − 2) con un punto vacío en (−3; −1/5)','']]],
  ['c)','Continuidad y tipo de discontinuidad',[
   ['x = −3: el límite existe (−1/5) pero f(−3) no → discontinuidad evitable',''],
   ['x = 2: límites infinitos → discontinuidad esencial (infinita)','']]]]},
 {t:'Dominio, raíces y asíntotas',src:'2do parcial Farmacia (doble cursado) · variante (x² − 4)/(2 + x²)',en:`g(x) = ${F('2x² + 2x + 6','x² + 5')}. Dominio, raíces, ordenada al origen y asíntotas.`,it:[
  ['','Resolución',[
   ['x² + 5 &gt; 0 siempre → Dom g = ℝ',''],
   ['2x² + 2x + 6 = 0: Δ = 4 − 48 &lt; 0 → no tiene raíces reales',''],
   ['Ordenada: g(0) = 6/5',''],
   ['El denominador nunca se anula → no hay asíntotas verticales',''],
   ['lím x→±∞ g(x) = 2/1 = 2 → asíntota horizontal y = 2','Mismo grado: cociente de coeficientes principales']]]]},
 {t:'Puntos de discontinuidad',src:'2do parcial Bioquímica · variante 9x/(x² − 2x + 1)',en:`f(x) = ${F('1 − x','x² − x − 6')}`,it:[
  ['a)','Puntos de discontinuidad',[
   ['x² − x − 6 = (x − 3)(x + 2) = 0 → x = 3 y x = −2','']]],
  ['b)','Tipo de cada discontinuidad',[
   ['x = 3: numerador 1 − 3 = −2 ≠ 0 → el cociente tiende a ∞','Esencial (infinita): asíntota vertical'],
   ['x = −2: numerador 1 + 2 = 3 ≠ 0 → tiende a ∞','Esencial (infinita): asíntota vertical']]]]},
 {t:'Continuidad con un parámetro',src:'Examen libre',en:'f(x) = ax − 3 si x &lt; 2 ; 3 − x + 2x² si x ≥ 2. ¿Para qué a es continua en todo ℝ?',it:[
  ['','Resolución',[
   ['f(2) = 3 − 2 + 8 = 9','Tramo x ≥ 2'],
   ['lím x→2⁻ (ax − 3) = 2a − 3 ; lím x→2⁺ = 9',''],
   ['Continua ⇔ 2a − 3 = 9 → a = 6',''],
   ['Fuera de x = 2 ambos tramos son polinomios: con a = 6 es continua en ℝ','Gráfico: recta 6x − 3 hasta (2; 9) y parábola 2x² − x + 3 desde ahí']]]]},
 {t:'Verdadero o falso sobre asíntotas y discontinuidades',src:'Parciales 2023 y 2025 · Examen libre',en:'Justificar cada respuesta.',it:[
  ['a)',`f(x) = ${F('2x − 3','1 − x')} tiene asíntota horizontal en y = 2 y asíntota vertical en x = 1.`,[
   ['lím x→±∞ (2x − 3)/(1 − x) = 2/(−1) = −2','La horizontal es y = −2'],
   ['En x = 1 el numerador vale −1 ≠ 0 → el límite es ∞','La vertical x = 1 es correcta'],
   ['FALSO: la asíntota horizontal es y = −2','']]],
  ['b)',`f(x) = ${F('2e<sup>x</sup> − 3','e<sup>x</sup>')} tiene asíntota horizontal en y = 2.`,[
   ['f(x) = 2 − 3e<sup>−x</sup>',''],
   ['lím x→+∞ f(x) = 2 − 0 = 2','VERDADERO (hacia −∞ tiende a −∞)']]],
  ['c)','f(x) = 1/x si x &gt; 0 ; x + 3 si x ≤ 0 presenta una discontinuidad evitable en x = 0.',[
   ['lím x→0⁻ (x + 3) = 3 ; lím x→0⁺ 1/x = +∞',''],
   ['FALSO: es una discontinuidad infinita (esencial)','No es evitable porque el límite no existe']]],
  ['d)',`f(x) = ${F(`${R('','x² + 16')} − 4`,'x²')} tiene asíntota vertical en x = 0 y asíntotas horizontales y = 1 e y = −1.`,[
   [`f(x) = ${F('(x² + 16) − 16',`x²(${R('','x² + 16')} + 4)`)} = ${F(1,`${R('','x² + 16')} + 4`)}`,'Multiplicamos y dividimos por el conjugado √(x² + 16) + 4'],
   ['lím x→0 f(x) = 1/8 (finito) → no hay asíntota vertical','FALSO'],
   ['lím x→±∞ f(x) = 0 → la asíntota horizontal es y = 0','FALSO']]]]},
 {t:'Comportamiento a largo plazo',src:'2do parcial Farmacia (doble cursado) · 2do parcial 27/06/2023',en:'Analizar cada modelo.',it:[
  ['a)',`Bacterias: B(t) = ${F(4,'2 + 8e<sup>−2t</sup>')} millones. ¿Se estabiliza o crece indefinidamente?`,[
   ['lím t→∞ e<sup>−2t</sup> = 0',''],
   ['lím t→∞ B(t) = 4/(2 + 0) = 2',''],
   ['Se estabiliza en 2 millones (asíntota horizontal B = 2)','Al comienzo B(0) = 4/10 = 0,4 millones']]],
  ['b)',`Sal: c(t) = ${F('3t','4000 + 100t')}. ¿Cuándo vale 0,025?`,[
   ['3t/(4000 + 100t) = 0,025',''],
   ['3t = 100 + 2,5t → 0,5t = 100',''],
   ['t = 200','']]],
  ['c)','¿Qué sucede con c(t) a largo plazo?',[
   ['lím t→∞ 3t/(4000 + 100t) = 3/100 = 0,03','Dividimos numerador y denominador por t'],
   ['La concentración se estabiliza en 0,03','']]]]}]);
